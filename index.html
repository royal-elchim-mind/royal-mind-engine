<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Elchim Luxury Engine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f8f9fa; font-family: 'Times New Roman', serif; padding-bottom: 80px; }
        .gold-text { color: #b58900; font-weight: bold; }
        .glass-card { background: white; border: 1px solid #e5b82c; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .gold-btn { background: linear-gradient(45deg, #b58900, #e5b82c); color: white; border: none; border-radius: 10px; width: 100%; padding: 12px; font-weight: bold; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid #ddd; z-index: 1000; }
        .nav-item { text-align: center; color: #777; cursor: pointer; font-size: 0.8rem; }
        .nav-item.active { color: #b58900; }
        .preview-box { border: 2px dashed #b58900; border-radius: 15px; padding: 10px; min-height: 100px; margin-top: 10px; text-align: center; }
        .preview-box img { max-width: 100%; border-radius: 10px; max-height: 200px; }
        .app-screen { display: none; } .app-screen.active { display: block; }
    </style>
</head>
<body>

    <div class="container pt-4 text-center">
        <img src="logo.jpg?v=3" style="max-width: 80px; border-radius: 50%;" onerror="this.src='https://via.placeholder.com/80'">
        <h5 class="gold-text mt-2">Royal Elchim Luxury Mind</h5>
    </div>

    <div class="container mt-3">
        <div id="screen-simulation" class="app-screen active">
            <div class="glass-card">
                <h5 class="text-center gold-text mb-3"><i class="fa-solid fa-wand-magic-sparkles"></i> مختبر الجمال والذكاء</h5>
                
                <select id="masterMode" class="form-select mb-3 fw-bold">
                    <optgroup label="المكياج والعلاج">
                        <option value="lips">💄 أحمر شفاه ملكي</option>
                        <option value="eyeshadow">👁️ ظلال عيون سحرية</option>
                        <option value="lenses">💎 عدسات (من صورة موديل)</option>
                        <option value="foundation">🎭 علاج ونحت البشرة</option>
                    </optgroup>
                    <optgroup label="تصميم الشعر">
                        <option value="hair_preset">💇 قصات ملكية جاهزة</option>
                        <option value="hair_custom">📸 دمج قصة من صورة خارجية</option>
                    </optgroup>
                </select>

                <div class="row">
                    <div class="col-6">
                        <label class="btn btn-outline-dark w-100"><i class="fa-solid fa-user"></i> وجهكِ<input type="file" hidden onchange="preview(this, 'uPre', 'uB64')"></label>
                        <div id="uPre" class="preview-box"></div>
                    </div>
                    <div class="col-6">
                        <label class="btn btn-outline-dark w-100"><i class="fa-solid fa-image"></i> القصة/المنتج<input type="file" hidden onchange="preview(this, 'pPre', 'pB64')"></label>
                        <div id="pPre" class="preview-box"></div>
                    </div>
                </div>

                <button class="gold-btn mt-4" onclick="runMasterSim()">إطلاق المحاكاة الوجدانية</button>
                <div id="masterResponse" class="mt-3 p-3 bg-light rounded small" style="display:none; white-space: pre-line;"></div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('simulation')"><i class="fa-solid fa-wand-magic-sparkles d-block"></i>المختبر</div>
        <div class="nav-item" onclick="switchTab('search')"><i class="fa-solid fa-search d-block"></i>البحث</div>
        <div class="nav-item" onclick="switchTab('perfume')"><i class="fa-solid fa-flask d-block"></i>الخيميائي</div>
    </div>

    <script>
        let images = { uB64: null, pB64: null };
        const API = "https://royal-elchim-newmind-royal-mind-engine.hf.space";

        function preview(input, preId, key) {
            const reader = new FileReader();
            reader.onload = (e) => {
                images[key] = e.target.result;
                document.getElementById(preId).innerHTML = `<img src="${e.target.result}">`;
            };
            reader.readAsDataURL(input.files[0]);
        }

        async function runMasterSim() {
            const out = document.getElementById('masterResponse');
            out.style.display = 'block'; out.innerHTML = "جاري التحليل الوجداني والرسم...";
            
            const res = await fetch(`${API}/api/simulate_master`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    user_selfie: images.uB64,
                    product_image: images.pB64,
                    mode: document.getElementById('masterMode').value,
                    phone: localStorage.getItem('royal_user_phone') || "0123456789"
                })
            });
            const data = await res.json();
            if(data.status === 'success') {
                out.innerHTML = `<img src="${data.result_image}" class="img-fluid rounded mb-3">` + data.simulation_result;
            }
        }

        function switchTab(id) {
            document.querySelectorAll('.app-screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-' + id).classList.add('active');
        }
    </script>
</body>
</html>
