<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Elchim - الوعي الجمالي الشامل</title>
    
    <!-- مكتبات التصميم -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* أنيميشن الخلفية الأورورا الملكية */
        @keyframes aurora {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body { 
            background: linear-gradient(135deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb, #d4fc79, #96e6a1, #fff1eb, #f1eefc); 
            background-size: 400% 400%; 
            animation: aurora 15s ease infinite; 
            color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding-bottom: 100px; 
            min-height: 100vh;
        }

        /* التصميم الزجاجي */
        .glass-card { 
            background: rgba(255, 255, 255, 0.8); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(181, 137, 0, 0.3); 
            border-radius: 20px; 
            padding: 20px; 
            margin-bottom: 20px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .gold-text { color: #b58900; font-weight: bold; }
        
        .gold-btn { 
            background: linear-gradient(45deg, #b58900, #e5b82c); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            padding: 12px; 
            font-weight: bold;
            transition: 0.3s;
            width: 100%;
        }

        .gold-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(181, 137, 0, 0.4); color: white; }

        /* شريط التنقل السفلي */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px);
            display: flex; overflow-x: auto; padding: 12px 5px; 
            border-top: 1px solid rgba(181, 137, 0, 0.2); 
            z-index: 1000;
        }

        .nav-item { 
            flex: 0 0 auto; min-width: 80px; text-align: center; 
            color: #777; cursor: pointer; transition: 0.3s; font-size: 0.75rem;
        }

        .nav-item i { font-size: 1.3rem; display: block; margin-bottom: 4px; }
        .nav-item.active { color: #b58900; font-weight: bold; transform: scale(1.1); }

        /* شاشة التحميل والدخول */
        #authOverlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #1a1a2e; z-index: 9999; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
        }

        /* الإشعارات الملكية */
        .royal-toast { 
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%); 
            background: #1a1a2e; color: #fff; padding: 12px 25px; 
            border-radius: 50px; border: 1px solid #b58900; 
            z-index: 10001; display: none; box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        /* الكاميرا */
        #cameraModal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); z-index: 10002; 
            display: none; flex-direction: column; align-items: center; justify-content: center; 
        }
        #cameraCircle { 
            width: 300px; height: 300px; border-radius: 50%; 
            border: 4px solid #b58900; overflow: hidden; position: relative; 
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .scan-line { 
            position: absolute; top: 0; width: 100%; height: 4px; 
            background: #b58900; box-shadow: 0 0 15px #b58900; 
            animation: scan 2s linear infinite; 
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        .app-screen { display: none; }
        .app-screen.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .mic-btn.listening { color: red; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <!-- الإشعار العلوي -->
    <div id="royalToast" class="royal-toast"></div>

    <!-- نافذة الكاميرا للـ Face ID -->
    <div id="cameraModal">
        <h4 class="text-white mb-3" id="camTitle">جاري فحص الملامح الملكية...</h4>
        <div id="cameraCircle">
            <video id="videoFeed" autoplay playsinline></video>
            <div class="scan-line"></div>
        </div>
        <div class="mt-4">
            <button class="btn btn-outline-light px-4" onclick="closeCamera()">إلغاء</button>
            <button class="btn btn-warning px-4 fw-bold" onclick="captureFace()">التقاط وبصم الوجه</button>
        </div>
    </div>

    <!-- شاشة الدخول -->
    <div id="authOverlay">
        <div class="glass-card text-center" style="width: 320px;">
            <img src="logo.jpg" class="rounded-circle mb-3" width="80" style="border: 2px solid #b58900;">
            <h4 class="gold-text">الهوية الملكية</h4>
            <input type="tel" id="loginPhone" class="form-control text-center my-3" placeholder="رقم الهاتف">
            <button class="gold-btn mb-2" onclick="login()">دخول القصر</button>
            <button class="btn btn-link text-warning btn-sm" onclick="startFaceID('login')">الدخول ببصمة الوجه 📸</button>
        </div>
    </div>

    <!-- الهيدر الرئيسي -->
    <div class="container pt-4 text-center">
        <h2 class="gold-text">ROYAL ELCHIM</h2>
        <p id="userStatus" class="small text-muted">أهلاً بك في نظام الوعي الجمالي</p>
        <button class="btn btn-sm btn-outline-dark mb-3" onclick="logout()">تبديل الحساب / خروج</button>
    </div>

    <div class="container">
        
        <!-- 1. شاشة البحث والمخزون -->
        <div id="screen-search" class="app-screen active">
            <div class="glass-card">
                <h5 class="gold-text mb-3"><i class="fa-solid fa-magnifying-glass"></i> البحث الذكي والمخزون</h5>
                <div class="input-group">
                    <button class="btn btn-outline-warning" onclick="voice('searchInput')"><i id="mic-searchInput" class="fa-solid fa-microphone mic-btn"></i></button>
                    <input type="text" id="searchInput" class="form-control text-end" placeholder="ابحث عن منتج..." oninput="search(this.value)">
                </div>
                <div id="searchResults" class="mt-3"></div>
            </div>
        </div>

        <!-- 2. شاشة الفواتير -->
        <div id="screen-invoice" class="app-screen">
            <div class="glass-card">
                <h5 class="gold-text mb-3"><i class="fa-solid fa-file-invoice"></i> نظام الفواتير الشريحي</h5>
                <div class="input-group mb-3">
                    <input type="password" id="vipCode" class="form-control text-center" placeholder="كود الجملة (اختياري)">
                    <button class="btn btn-warning" onclick="calculateInvoice()"><i class="fa-solid fa-sync"></i></button>
                </div>
                <div id="cartItems" class="mb-3"></div>
                <div class="p-3 bg-white rounded border border-warning">
                    <div class="d-flex justify-content-between mb-1"><span>المجموع:</span> <span id="totalBase">0</span></div>
                    <div class="d-flex justify-content-between gold-text fw-bold"><span>المستحق النهائي:</span> <span id="totalFinal">0</span></div>
                    <small id="tierInfo" class="text-muted d-block mt-2"></small>
                </div>
            </div>
        </div>

        <!-- 3. شاشة العطور -->
        <div id="screen-perfume" class="app-screen">
            <div class="glass-card">
                <h5 class="gold-text mb-3"><i class="fa-solid fa-vial"></i> الخيميائي الملكي</h5>
                <textarea id="perfumeText" class="form-control mb-3" rows="3" placeholder="اوصفي لي شخصيتكِ أو طلبكِ العطري..."></textarea>
                <button class="gold-btn" onclick="askAI('perfume')">تحليل الهالة العطرية</button>
                <div id="perfumeRes" class="mt-3 small p-3 bg-white rounded shadow-sm" style="display:none;"></div>
            </div>
        </div>

        <!-- 4. شاشة الواقع المعزز و Face ID -->
        <div id="screen-ar" class="app-screen">
            <div class="glass-card text-center">
                <h5 class="gold-text mb-3"><i class="fa-solid fa-face-smile"></i> مختبر الهوية والجمال</h5>
                <button class="btn btn-warning w-100 fw-bold mb-3" onclick="startFaceID('reg')">توثيق بصمة الوجه (Face ID)</button>
                <hr>
                <p class="small">محاكاة المكياج والعدسات</p>
                <input type="file" accept="image/*" class="form-control mb-2" id="userImg" onchange="preview(this, 'p1')">
                <div id="p1" class="mb-2"></div>
                <button class="gold-btn" onclick="runSim()">بدء النحت البصري AR</button>
            </div>
        </div>

        <!-- 5. الذاكرة -->
        <div id="screen-vault" class="app-screen">
            <div class="glass-card">
                <h5 class="gold-text mb-3"><i class="fa-solid fa-history"></i> سجلات الوعي والذاكرة</h5>
                <div id="vaultContent"></div>
            </div>
        </div>

    </div>

    <!-- شريط التنقل -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="tab('search', this)"><i class="fa-solid fa-search"></i>بحث</div>
        <div class="nav-item" onclick="tab('invoice', this)"><i class="fa-solid fa-receipt"></i>فواتير</div>
        <div class="nav-item" onclick="tab('perfume', this)"><i class="fa-solid fa-wind"></i>عطور</div>
        <div class="nav-item" onclick="tab('ar', this)"><i class="fa-solid fa-wand-magic-sparkles"></i>جمال</div>
        <div class="nav-item" onclick="tab('vault', this)"><i class="fa-solid fa-brain"></i>الذاكرة</div>
    </div>

    <script>
        const API = "https://royal-elchim-newmind-royal-mind-engine.hf.space";
        let cart = [];
        let stream = null;
        let facePurpose = '';

        // تبديل الشاشات
        function tab(name, el) {
            document.querySelectorAll('.app-screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('screen-' + name).classList.add('active');
            el.classList.add('active');
            if(name === 'vault') loadVault();
        }

        // الإشعارات
        function toast(msg) {
            const t = document.getElementById('royalToast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        // الدخول والخروج
        function login() {
            const p = document.getElementById('loginPhone').value;
            if(p.length < 5) return toast("يرجى إدخال رقم هاتف صحيح");
            localStorage.setItem('royal_phone', p);
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('userStatus').innerText = "العميل الملكي: " + p;
            toast("مرحباً بك في عالم رويال الكيم ✨");
        }

        function logout() {
            localStorage.removeItem('royal_phone');
            location.reload();
        }

        if(localStorage.getItem('royal_phone')) {
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('userStatus').innerText = "العميل الملكي: " + localStorage.getItem('royal_phone');
        }

        // البحث والمخزون
        async function search(q) {
            if(q.length < 2) return;
            const res = await fetch(`${API}/api/search?query=${q}`);
            const d = await res.json();
            const out = document.getElementById('searchResults');
            out.innerHTML = d.data.map(item => `
                <div class="p-2 border-bottom d-flex justify-content-between align-items-center">
                    <button class="btn btn-sm btn-warning" onclick='addToCart(${JSON.stringify(item)})'>+</button>
                    <div class="text-end">
                        <div class="fw-bold">${item.name}</div>
                        <small class="text-muted">${item.price} ج.م | فروعنا: متوفر</small>
                    </div>
                </div>
            `).join('');
        }

        // الفواتير
        function addToCart(item) {
            cart.push(item);
            toast("تمت الإضافة للفاتورة");
            calculateInvoice();
        }

        async function calculateInvoice() {
            const res = await fetch(`${API}/api/calculate_invoice`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    items: cart.map(i => ({ name: i.name, base_price: i.price, quantity: 1, is_fixed_price: i.is_fixed_price })),
                    secret_code: document.getElementById('vipCode').value
                })
            });
            const d = await res.json();
            document.getElementById('totalBase').innerText = d.base_total + " ج.م";
            document.getElementById('totalFinal').innerText = d.final_total + " ج.م";
            document.getElementById('tierInfo').innerText = "الشريحة المطبقة: " + d.tier_applied;
            
            document.getElementById('cartItems').innerHTML = cart.map((i, idx) => `
                <div class="small d-flex justify-content-between border-bottom py-1">
                    <span class="text-danger" onclick="cart.splice(${idx},1);calculateInvoice()">❌</span>
                    <span>${i.name}</span>
                    <span>${i.price}</span>
                </div>
            `).join('');
        }

        // الذكاء الاصطناعي (عطور / تشخيص)
        async function askAI(type) {
            const txt = document.getElementById('perfumeText').value;
            const out = document.getElementById('perfumeRes');
            out.style.display = 'block';
            out.innerHTML = "جاري التحليل الملكي...";
            
            const res = await fetch(`${API}/api/craft_perfume`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ client_message: txt, phone: localStorage.getItem('royal_phone') })
            });
            const d = await res.json();
            out.innerHTML = d.answer;
        }

        // التعرف على الوجه Face ID
        async function startFaceID(purpose) {
            facePurpose = purpose;
            document.getElementById('cameraModal').style.display = 'flex';
            stream = await navigator.mediaDevices.getUserMedia({ video: true });
            document.getElementById('videoFeed').srcObject = stream;
        }

        function closeCamera() {
            stream.getTracks().forEach(t => t.stop());
            document.getElementById('cameraModal').style.display = 'none';
        }

        async function captureFace() {
            const v = document.getElementById('videoFeed');
            const canvas = document.createElement('canvas');
            canvas.width = v.videoWidth; canvas.height = v.videoHeight;
            canvas.getContext('2d').drawImage(v, 0, 0);
            const b64 = canvas.toDataURL('image/jpeg');
            closeCamera();
            
            toast("جاري فحص البصمة...");
            const endpoint = facePurpose === 'login' ? 'verify_face_login' : 'register_face';
            const body = facePurpose === 'login' ? { selfie: b64 } : { phone: localStorage.getItem('royal_phone'), selfie: b64 };

            const res = await fetch(`${API}/api/${endpoint}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            const d = await res.json();
            
            if(d.status === 'success') {
                if(facePurpose === 'login') {
                    localStorage.setItem('royal_phone', d.phone);
                    location.reload();
                } else {
                    toast("تم توثيق وجهكِ بنجاح 👑");
                }
            } else {
                toast("لم يتم التعرف على الوجه");
            }
        }

        // الذاكرة
        async function loadVault() {
            const res = await fetch(`${API}/api/vault?phone=${localStorage.getItem('royal_phone')}`);
            const d = await res.json();
            document.getElementById('vaultContent').innerHTML = d.data.map(v => `
                <div class="p-2 mb-2 bg-white rounded border-end border-warning border-3 small">
                    <div class="gold-text">${v.date}</div>
                    <div>${v.aiText}</div>
                </div>
            `).join('');
        }

        // صوت
        function voice(id) {
            const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
            const r = new Rec(); r.lang = 'ar-EG';
            r.onstart = () => document.getElementById('mic-'+id).classList.add('listening');
            r.onresult = (e) => {
                document.getElementById(id).value = e.results[0][0].transcript;
                if(id === 'searchInput') search(e.results[0][0].transcript);
            };
            r.onend = () => document.getElementById('mic-'+id).classList.remove('listening');
            r.start();
        }
    </script>
</body>
</html>
