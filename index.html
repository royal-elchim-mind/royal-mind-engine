<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Elchim - الوعي الجمالي الشامل</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes aurora { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        body { 
            background: linear-gradient(135deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb, #d4fc79, #96e6a1, #fff1eb, #f1eefc); 
            background-size: 300% 300%; animation: aurora 12s ease infinite; color: #1a1a2e;
            font-family: 'Times New Roman', serif; padding-bottom: 90px; min-height: 100vh; overflow-x: hidden;
        }
        .gold-text { color: #b58900; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1); font-weight: bold; }
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(181, 137, 0, 0.3); border-radius: 16px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06); }
        .gold-btn { background: linear-gradient(45deg, #b58900, #e5b82c, #b58900); color: #fff; font-weight: bold; border: none; border-radius: 8px; padding: 12px; transition: 0.3s; width: 100%; text-align: center; display: block; text-decoration: none; cursor: pointer; }
        .gold-btn:hover { background: linear-gradient(45deg, #e5b82c, #f3e5ab, #e5b82c); color: #1a1a2e; transform: scale(1.02); }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(15px); border-top: 1px solid rgba(181, 137, 0, 0.4); display: flex; overflow-x: auto; white-space: nowrap; padding: 10px 5px; z-index: 1000; }
        .nav-item { text-align: center; color: #555577; cursor: pointer; flex: 0 0 auto; min-width: 78px; font-size: 0.72rem; transition: 0.3s; }
        .nav-item i { font-size: 1.25rem; display: block; margin-bottom: 3px; }
        .nav-item.active { color: #b58900; font-weight: bold; }
        .app-screen { display: none; } .app-screen.active { display: block; }
        #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #12121c; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .royal-toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-50px); opacity: 0; background: rgba(26, 26, 46, 0.95); color: #fff; border: 1px solid #b58900; padding: 15px 30px; z-index: 10000; transition: all 0.4s; }
        .royal-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div id="royalToast" class="royal-toast"></div>

    <div id="authOverlay">
        <div class="glass-card text-center" style="width: 350px;">
            <img src="logo.jpg" style="max-width: 100px; border-radius: 50%; border: 2px solid #b58900; padding: 5px;">
            <h4 class="gold-text mt-3">بوابة الهوية الملكية</h4>
            <input type="tel" id="royalPhoneInput" class="form-control text-center my-3" placeholder="أدخل رقم هاتف العميل">
            <button class="gold-btn" onclick="authenticateUser()">دخول القصر الملكي</button>
        </div>
    </div>

    <div class="container pt-4 text-center">
        <div class="royal-logo-container" style="width: 100px; height: 100px; margin: 0 auto; border-radius: 50%; border: 2px solid #b58900; overflow: hidden;">
            <img src="logo.jpg" style="width:100%; height:100%; object-fit: cover;">
        </div>
        <h3 class="gold-text fw-bold mt-2">ROYAL ELCHIM</h3>
    </div>

    <div class="container mt-2">
        <div id="screen-search" class="app-screen active">
            <div class="glass-card">
                <h4 class="gold-text text-center">شاشة الاستعلام</h4>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('search', this)"><i class="fa-solid fa-barcode"></i><span>الاستعلام</span></div>
    </div>

    <script>
        // دالة تعريف المستخدم
        function authenticateUser() {
            let phone = document.getElementById('royalPhoneInput').value.trim();
            if(phone.length < 5) {
                showRoyalNotification("يرجى إدخال رقم هاتف صحيح.", "error");
                return;
            }
            localStorage.setItem('royal_user_phone', phone);
            document.getElementById('authOverlay').style.display = 'none';
            showRoyalNotification("مرحباً بك في عالم رويال الكيم!");
        }

        // دالة الإشعارات
        function showRoyalNotification(message, type = "success") {
            const toast = document.getElementById('royalToast');
            toast.innerText = message;
            toast.style.borderColor = type === "success" ? "#b58900" : "#ff4d4d";
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // دالة التنقل
        function switchTab(id, el) {
            document.querySelectorAll('.app-screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('screen-' + id).classList.add('active');
            el.classList.add('active');
        }

        // فحص الجلسة عند التحميل
        window.onload = () => {
            if(localStorage.getItem('royal_user_phone')) {
                document.getElementById('authOverlay').style.display = 'none';
            }
        };
    </script>
</body>
</html>
