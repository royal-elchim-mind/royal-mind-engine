<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Elchim - V3 Enterprise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); font-family: 'Times New Roman', serif; padding-bottom: 90px; }
        .gold-text { color: #b58900; font-weight: bold; }
        .glass-card { background: white; border: 1px solid #e5b82c; border-radius: 16px; padding: 25px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .gold-btn { background: linear-gradient(45deg, #b58900, #e5b82c); color: white; border: none; border-radius: 8px; padding: 12px; width: 100%; font-weight: bold; transition: 0.3s; }
        .gold-btn:hover { transform: scale(1.02); }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; left: 0; background: white; display: flex; overflow-x: auto; padding: 10px; border-top: 1px solid #eee; z-index: 1000; }
        .bottom-nav::-webkit-scrollbar { display: none; }
        .nav-item { flex: 0 0 auto; min-width: 75px; text-align: center; color: #777; font-size: 0.8rem; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: #b58900; font-weight: bold; transform: translateY(-2px); }
        .app-screen { display: none; animation: fadeIn 0.4s ease-out; } .app-screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #authOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.98); z-index:9999; display:flex; justify-content:center; align-items:center; }
        .mic-btn { position: absolute; left: 10px; bottom: 10px; background: rgba(212, 175, 55, 0.15); color: #b58900; border: 1px solid #b58900; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; z-index: 10; }
        .preview-img { max-width: 100px; border-radius: 50%; border: 2px solid #b58900; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="authOverlay">
        <div class="glass-card text-center" style="width: 350px;">
            <h4 class="gold-text mb-3">البوابة البصرية (Face ID)</h4>
            <label class="btn btn-outline-warning w-100 p-3 mb-3 fw-bold border-2">
                <i class="fa-solid fa-camera mb-2"></i> التقاط الوجه للتحقق
                <input type="file" id="faceInput" hidden accept="image/*" capture="user">
            </label>
            <div id="loginPreview"></div>
            <div id="phoneInputContainer" style="display: none;">
                <input type="tel" id="newPhoneInput" class="form-control text-center mb-3" placeholder="أدخل رقم هاتفك">
                <button class="gold-btn" onclick="submitNewFace()">توثيق وبدء الرحلة</button>
            </div>
        </div>
    </div>

    <div class="container pt-3 text-center">
        <h4 class="gold-text fw-bold">ROYAL ELCHIM</h4>
    </div>

    <div class="container mt-2">
        <div id="screen-diagnosis" class="app-screen active">
            <div class="glass-card">
                <h4 class="gold-text mb-3 text-center"><i class="fa-solid fa-infinity"></i> رويال مايند</h4>
                <div class="position-relative mb-4">
                    <textarea id="diagnosisInput" class="form-control" rows="4" placeholder="تحدثي أو اكتبي ما يجول بخاطركِ..."></textarea>
                </div>
                <button class="gold-btn py-2" onclick="runDiagnosis()">إرسال</button>
            </div>
        </div>
    </div>

    <script>
        // تعريف الدوال في بداية السكربت لضمان توافرها
        function processFaceLogin(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('loginPreview').innerHTML = `<img src="${e.target.result}" class="preview-img">`;
                    document.getElementById('phoneInputContainer').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function submitNewFace() {
            document.getElementById('authOverlay').style.display = 'none';
        }

        function runDiagnosis() {
            alert("تم إرسال الطلب لرويال مايند بنجاح.");
        }

        // الربط بالحدث بعد تحميل الصفحة بالكامل
        window.onload = () => {
            const faceInput = document.getElementById('faceInput');
            if (faceInput) {
                faceInput.addEventListener('change', processFaceLogin);
            }
        };

        const BACKEND_URL = 'https://royal-elchim-newmind-royal-mind-engine.hf.space';
        
        async function apiFetch(endpoint, options = {}) {
            try {
                const response = await fetch(`${BACKEND_URL}${endpoint}`, options);
                if (!response.ok) throw new Error(`خطأ سيرفر (${response.status})`);
                return await response.json();
            } catch (err) { console.error(err); throw err; }
        }
    </script>
</body>
</html>
