<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Elchim Luxury Mind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #fdfdfd; font-family: 'Times New Roman', serif; padding-bottom: 90px; }
        .gold-text { color: #b58900; font-weight: bold; }
        .glass-card { background: white; border: 1px solid #e5b82c; border-radius: 25px; padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .gold-btn { background: linear-gradient(45deg, #b58900, #e5b82c); color: white; border: none; border-radius: 12px; width: 100%; padding: 15px; font-weight: bold; transition: 0.3s; }
        .gold-btn:hover { transform: scale(1.02); box-shadow: 0 5px 15px rgba(181,137,0,0.3); }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid #eee; z-index: 2000; }
        .nav-item { text-align: center; color: #888; cursor: pointer; font-size: 0.75rem; flex: 1; }
        .nav-item.active { color: #b58900; }
        .nav-item i { font-size: 1.4rem; margin-bottom: 4px; display: block; }
        .app-screen { display: none; animation: fadeIn 0.4s; } .app-screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .preview-box { border: 2px dashed #b58900; border-radius: 15px; padding: 10px; min-height: 120px; margin-top: 10px; text-align: center; background: #fffaf0; }
        .preview-box img { max-width: 100%; border-radius: 10px; max-height: 180px; }
        #authOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.98); z-index:9999; display:flex; justify-content:center; align-items:center; }
    </style>
</head>
<body>

    <div id="authOverlay">
        <div class="glass-card text-center" style="width: 350px;">
            <img src="logo.jpg" style="max-width: 100px; border-radius: 50%; border: 2px solid #b58900; padding: 5px;">
            <h4 class="gold-text mt-3">بوابة الهوية الملكية</h4>
            <input type="tel" id="pInp" class="form-control text-center my-3 fw-bold" placeholder="رقم الهاتف">
            <button class="gold-btn" onclick="login()">دخول القصر</button>
        </div>
    </div>

    <div class="container pt-4 text-center">
        <img src="logo.jpg" style="max-width: 70px; border-radius: 50%; border: 1px solid #b58900;">
        <h6 class="gold-text mt-2">Royal Elchim Luxury Engine</h6>
    </div>

    <div class="container mt-3">
        <div id="screen-simulation" class="app-screen active">
            <div class="glass-card">
                <h5 class="text-center gold-text mb-3"><i class="fa-solid fa-wand-magic-sparkles"></i> مختبر الجمال والذكاء</h5>
                
                <select id="masterMode" class="form-select mb-3 fw-bold text-center border-warning">
                    <optgroup label="المكياج والعلاج">
                        <option value="lenses">💎 عدسات ملكية (من صورة موديل)</option>
                        <option value="lips">💄 أحمر شفاه ملكي</option>
                        <option value="eyeshadow">👁️ ظلال عيون سحرية</option>
                        <option value="foundation">🎭 علاج ونحت البشرة</option>
                    </optgroup>
                    <optgroup label="تصميم الشعر">
                        <option value="hair_custom">📸 دمج قصة من صورة (خارجي)</option>
                        <option value="hair_preset">💇 قصات رويال الجاهزة</option>
                    </optgroup>
                </select>

                <div class="row">
                    <div class="col-6">
                        <label class="btn btn-outline-dark btn-sm w-100 mb-1"><i class="fa-solid fa-user"></i> وجهكِ<input type="file" hidden onchange="pre(this, 'uPre', 'uB64')"></label>
                        <div id="uPre" class="preview-box"></div>
                    </div>
                    <div class="col-6">
                        <label class="btn btn-outline-dark btn-sm w-100 mb-1"><i class="fa-solid fa-image"></i> القصة/المنتج<input type="file" hidden onchange="pre(this, 'pPre', 'pB64')"></label>
                        <div id="pPre" class="preview-box"></div>
                    </div>
                </div>

                <button class="gold-btn mt-4" onclick="runSim()">إطلاق المحاكاة الوجدانية</button>
                <div id="simRes" class="mt-3 p-3 bg-light rounded small border-start border-warning border-4" style="display:none; white-space: pre-line; line-height: 1.6;"></div>
            </div>
        </div>

        <div id="screen-search" class="app-screen">
            <div class="glass-card">
                <h5 class="gold-text mb-3 text-center"><i class="fa-solid fa-search"></i> استعلام الجرد والموقع</h5>
                <input type="text" class="form-control text-center py-2" placeholder="ابحث عن صنف..." oninput="doSearch(this.value)">
                <div id="searchRes" class="mt-3"></div>
            </div>
        </div>

        <div id="screen-perfume" class="app-screen">
            <div class="glass-card">
                <h5 class="gold-text mb-3 text-center"><i class="fa-solid fa-flask"></i> الخيميائي الكيميائي</h5>
                <textarea id="perfInp" class="form-control mb-3" rows="4" placeholder="صفي روحكِ العطرية..."></textarea>
                <button class="gold-btn" onclick="runPerfume()">تصميم العطر الملكي</button>
                <div id="perfRes" class="mt-3 p-3 bg-light rounded small" style="display:none;"></div>
            </div>
        </div>

        <div id="screen-vault" class="app-screen">
            <div class="glass-card">
                <h5 class="gold-text mb-3 text-center"><i class="fa-solid fa-server"></i> السجلات المركزية</h5>
                <div id="vaultRes"></div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="tab('simulation')"><i class="fa-solid fa-wand-magic-sparkles"></i><span>المختبر</span></div>
        <div class="nav-item" onclick="tab('search')"><i class="fa-solid fa-search"></i><span>البحث</span></div>
        <div class="nav-item" onclick="tab('perfume')"><i class="fa-solid fa-flask"></i><span>الخيميائي</span></div>
        <div class="nav-item" onclick="tab('vault')"><i class="fa-solid fa-server"></i><span>السجلات</span></div>
    </div>

    <script>
        let imgs = { uB64: null, pB64: null };
        const API = "https://royal-elchim-newmind-royal-mind-engine.hf.space";

        function login() {
            let p = document.getElementById('pInp').value;
            if(p.length < 5) return;
            localStorage.setItem('royal_user_phone', p);
            document.getElementById('authOverlay').style.display = 'none';
            renderVault();
        }

        if(localStorage.getItem('royal_user_phone')) document.getElementById('authOverlay').style.display = 'none';

        function pre(input, id, key) {
            const reader = new FileReader();
            reader.onload = (e) => {
                imgs[key] = e.target.result;
                document.getElementById(id).innerHTML = `<img src="${e.target.result}">`;
            };
            reader.readAsDataURL(input.files[0]);
        }

        async function runSim() {
            const out = document.getElementById('simRes');
            out.style.display = 'block'; out.innerHTML = "جاري التحليل الكيميائي والوجداني...";
            const res = await fetch(`${API}/api/simulate_master`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    user_selfie: imgs.uB64, product_image: imgs.pB64,
                    mode: document.getElementById('masterMode').value,
                    phone: localStorage.getItem('royal_user_phone')
                })
            });
            const d = await res.json();
            if(d.status === 'success') {
                out.innerHTML = `<img src="${d.result_image}" class="img-fluid rounded mb-3 shadow">` + d.simulation_result;
                renderVault();
            }
        }

        async function doSearch(q) {
            if(q.length < 2) return;
            const res = await fetch(`${API}/api/search?query=${q}`);
            const d = await res.json();
            document.getElementById('searchRes').innerHTML = d.data.map(i => `<div class="p-3 border-bottom">${i.name}<br><b class="gold-text">${i.price} ج.م</b></div>`).join('');
        }

        async function runPerfume() {
            const out = document.getElementById('perfRes');
            out.style.display = 'block'; out.innerHTML = "الخيميائي يزن المكونات بالجرامات...";
            const res = await fetch(`${API}/api/craft_perfume`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ client_message: document.getElementById('perfInp').value, phone: localStorage.getItem('royal_user_phone') })
            });
            const d = await res.json();
            out.innerHTML = d.answer;
        }

        async function renderVault() {
            const res = await fetch(`${API}/api/vault?phone=${localStorage.getItem('royal_user_phone')}`);
            const d = await res.json();
            document.getElementById('vaultRes').innerHTML = d.data.map(i => `
                <div class="mb-3 p-3 bg-light rounded text-end">
                    <small class="gold-text">${i.type} - ${i.date}</small>
                    ${i.selfie ? `<img src="${i.selfie}" class="d-block my-2" style="max-width:100px;">` : ''}
                    <div style="font-size:0.85rem;">${i.text}</div>
                </div>
            `).join('');
        }

        function tab(id) {
            document.querySelectorAll('.app-screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('screen-' + id).classList.add('active');
            event.currentTarget.classList.add('active');
            if(id === 'vault') renderVault();
        }
    </script>
</body>
</html>
